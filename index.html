```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon - الموقع قيد الصيانة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 600px;
            padding: 50px 25px;
            background: #151515;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        h2 {
            font-size: 24px;
            margin: 15px 0;
        }

        p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.8;
        }

        .loading {
            margin: 25px auto 0;
            width: 45px;
            height: 45px;
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="icon">🛠️</div>

        <h1>SOON</h1>

        <h2>الرجاء المحاولة فيما بعد</h2>

        <p>
            يتم الآن حل المشكلة وتحديث الموقع.
            <br>
            نعتذر عن الإزعاج، وشكرًا لصبركم.
        </p>

        <div class="loading"></div>
    </div>

</body>
</html>
```
