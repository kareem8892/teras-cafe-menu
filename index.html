<html lang="ar" dir="rtl">

<!-- شعار علامة التبويب -->

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#080808;
color:#fff;
min-height:100vh;
transition:background .3s,color .3s;
}

body.light-mode{
background:#f4f4f4;
color:#171717;
}

/* الصفحة الرئيسية */

#homePage{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:25px;
background:radial-gradient(
circle at center,
#292929 0%,
#0b0b0b 55%,
#000 100%
);
}

.home-logo{
width:200px;
height:200px;
object-fit:contain;
margin-bottom:20px;
filter:drop-shadow(
0 0 25px
rgba(255,255,255,.15)
);
}

.home-title{
font-size:48px;
font-weight:bold;
letter-spacing:3px;
margin-bottom:25px;
}

.menu-button{
border:none;
background:linear-gradient(
135deg,
#d4af37,
#f5d77a
);
color:#111;
padding:17px 45px;
border-radius:15px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.menu-button:hover{
transform:translateY(-4px);
box-shadow:
0 10px 30px
rgba(212,175,55,.35);
}

.home-note{
margin-top:20px;
font-size:15px;
color:#ffcc66;
}

/* صفحة المنيو */

#menuPage{
display:none;
}

/* الهيدر */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(8,8,8,.97);
backdrop-filter:blur(15px);
border-bottom:1px solid #292929;
padding:12px 15px;
}

.header-content{
max-width:1450px;
margin:auto;
display:flex;
align-items:center;
justify-content:flex-start;
gap:12px;
direction:rtl;
}

.header-logo{
width:58px;
height:58px;
object-fit:contain;
display:block;
}

.header-name{
font-size:29px;
font-weight:bold;
letter-spacing:2px;
color:#fff;
}

/* أزرار الأقسام */

.categories{
max-width:1450px;
margin:12px auto 0;
padding:5px;
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:10px;
width:100%;
}

.category-btn{
border:1px solid #3b3b3b;
background:#151515;
color:#eee;
padding:11px 17px;
border-radius:12px;
cursor:pointer;
font-family:inherit;
font-weight:bold;
font-size:14px;
white-space:nowrap;
transition:.25s;
}

.category-btn:hover{
background:#d4af37;
color:#111;
border-color:#d4af37;
transform:translateY(-2px);
}

.category-btn.active{
background:#d4af37;
color:#111;
border-color:#d4af37;
}

/* حساباتنا */

.accounts{
position:relative;
}

.accounts-menu{
display:none;
position:absolute;
top:52px;
right:50%;
transform:translateX(50%);
background:#151515;
border:1px solid #383838;
border-radius:15px;
padding:10px;
width:280px;
box-shadow:0 15px 40px rgba(0,0,0,.8);
z-index:1500;
}

.accounts-menu.show{
display:block;
}

.social-btn{
display:flex;
align-items:center;
gap:12px;
width:100%;
padding:12px;
margin:5px 0;
border:none;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
font-family:inherit;
cursor:pointer;
transition:.25s;
}

.social-btn:hover{
transform:scale(1.03);
filter:brightness(1.15);
}

.social-icon{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
border-radius:8px;
}

.facebook{
background:#1877F2;
}

.instagram{
background:linear-gradient(
45deg,
#feda75,
#d62976,
#4f5bd5
);
}

.tiktok{
background:#050505;
border:1px solid #444;
}

.contact-btn{
background:#333;
}

.contact-btn:hover{
background:#444;
}

/* زر الإضاءة */

.theme-btn{
background:#222;
color:#fff;
border:1px solid #444;
}

.theme-btn:hover{
background:#d4af37;
color:#111;
}

/* المحتوى */

.container{
max-width:1450px;
margin:auto;
padding:20px;
}

.section-title{
text-align:center;
color:#d4af37;
font-size:31px;
margin:20px 0 25px;
}

.items-grid{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(240px,1fr)
);
gap:18px;
}

/* بطاقة الصنف */

.item{
background:linear-gradient(
145deg,
#181818,
#101010
);
border:1px solid #2c2c2c;
border-radius:18px;
padding:20px;
min-height:175px;
display:flex;
flex-direction:column;
justify-content:space-between;
transition:.25s;
}

.item:hover{
transform:translateY(-4px);
border-color:#d4af37;
box-shadow:
0 12px 35px
rgba(0,0,0,.5);
}

.item-name{
font-size:18px;
font-weight:bold;
line-height:1.7;
}

.item-description{
color:#aaa;
font-size:13px;
line-height:1.7;
margin-top:8px;
}

.item-bottom{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:20px;
}

.price{
color:#d4af37;
font-size:19px;
font-weight:bold;
}

.add-btn{
border:none;
background:#d4af37;
color:#111;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-family:inherit;
}

.add-btn:hover{
background:#f5d77a;
}

/* زر السلة */

.cart-btn{
position:fixed;
bottom:20px;
left:20px;
z-index:2000;
border:none;
background:#d4af37;
color:#111;
padding:15px 20px;
border-radius:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
box-shadow:
0 8px 30px
rgba(0,0,0,.7);
}

.cart-count{
background:#c62828;
color:white;
border-radius:50%;
padding:3px 7px;
font-size:12px;
margin-right:5px;
}

/* الوضع العادي */

body.light-mode header{
background:rgba(255,255,255,.97);
border-bottom:1px solid #ddd;
}

body.light-mode .header-name{
color:#222;
}

body.light-mode .category-btn{
background:#fff;
color:#222;
border-color:#ddd;
}

body.light-mode .item{
background:#fff;
color:#222;
border-color:#ddd;
}

body.light-mode .item-description{
color:#666;
}

/* الكمبيوتر */

@media(min-width:1000px){

.items-grid{
grid-template-columns:repeat(4,1fr);
}

.category-btn{
font-size:15px;
padding:12px 19px;
}

}

/* الآيباد */

@media(min-width:601px) and (max-width:999px){

.items-grid{
grid-template-columns:repeat(2,1fr);
}

}

/* الجوال */

@media(max-width:600px){

.home-logo{
width:150px;
height:150px;
}

.home-title{
font-size:38px;
}

.header-logo{
width:50px;
height:50px;
}

.header-name{
font-size:23px;
}

.categories{
justify-content:center;
gap:7px;
}

.category-btn{
font-size:12px;
padding:10px 12px;
}

.items-grid{
grid-template-columns:1fr;
}

.cart-btn{
left:12px;
bottom:12px;
}

.accounts-menu{
position:fixed;
top:130px;
left:15px;
right:15px;
width:auto;
transform:none;

<script>

/* فتح الموقع */

function openMenu(){

document.getElementById("homePage").style.display="none";

document.getElementById("menuPage").style.display="block";

createCategories();

}

/* إنشاء الأقسام */

function createCategories(){

const categories=
document.getElementById("categories");

categories.innerHTML="";

const sectionNames=[

"الفطور",
"المقبلات",
"ساندويشات",
"السلطات",
"الوجبات الرئيسية",
"مطبخ إيطالي",
"بيتزا",
"بحري",
"ايسات",

"نكهات ترس الحصرية",
"حلويات",
"مشروبات ساخنة",
"مشروبات باردة",
"الأراجيل"

];

sectionNames.forEach(

(category,index)=>{

const button=
document.createElement("button");

button.className="category-btn";

if(index===0){

button.classList.add("active");

}

button.innerText=category;

button.onclick=()=>{

showCategory(category,button);

};

categories.appendChild(button);

});

/* حساباتنا */

const accounts=
document.createElement("div");

accounts.className="accounts";

accounts.innerHTML=`

<button
class="category-btn"
onclick="toggleAccounts(event)">

حساباتنا

</button>

<div
class="accounts-menu"
id="accountsMenu">

<a
class="social-btn facebook"
href="https://www.facebook.com/share/16BH7YpP58s/"
target="_blank">

<span class="social-icon">
f
</span>

صفحتنا على الفيسبوك

</a>

<a
class="social-btn instagram"
href="https://www.instagram.com/tarra_ce?igsh=MW5ueGpya2cyczhkeQ=="
target="_blank">

<span class="social-icon">
◎
</span>

تابعنا على الإنستغرام

</a>

<a
class="social-btn tiktok"
href="https://www.tiktok.com/@tarrace_?_r=1&_t=ZS-98PMCiJpfYQ"
target="_blank">

<span class="social-icon">
♪
</span>

تابعنا على تيك توك

</a>

<a
class="social-btn contact-btn"
href="tel:+970598989595">

<span class="social-icon">
📞
</span>

اتصل بنا: +970 598 989 595

</a>

</div>

`;

categories.appendChild(accounts);

/* زر الإضاءة */

const themeButton=
document.createElement("button");

themeButton.className=
"category-btn theme-btn";

themeButton.innerText=
"☀️ إضاءة عادية";

themeButton.onclick=
toggleTheme;

categories.appendChild(themeButton);

}

/* حساباتنا */

function toggleAccounts(event){

event.stopPropagation();

const menu=
document.getElementById("accountsMenu");

menu.classList.toggle("show");

}

/* الوضع الليلي / العادي */

function toggleTheme(){

document.body.classList.toggle("light-mode");

const button=
document.querySelector(".theme-btn");

if(
document.body.classList.contains("light-mode")
){

button.innerText=
"🌙 الوضع الليلي";

}else{

button.innerText=
"☀️ إضاءة عادية";

}

}

/* عرض القسم */

function showCategory(category,button){

document
.querySelectorAll(".category-btn")
.forEach(btn=>{

btn.classList.remove("active");

});

if(button){

button.classList.add("active");

}

const container=
document.getElementById("menuContainer");

container.innerHTML=`

<h2 class="section-title">

${category}

</h2>

<div class="items-grid">

<div class="item">

<div class="item-name">

سيتم تحميل الأصناف...

</div>

</div>

</div>

`;

}

/* السلة */

function openCart(){

alert(
"سيتم فتح السلة في الجزء الثالث"
);

}

/* إغلاق قائمة الحسابات */

document.addEventListener(

"click",

function(){

const menu=
document.getElementById("accountsMenu");

if(menu){

menu.classList.remove("show");

}

}

);

</script>

</body>

<script>

/* =========================
السلة
========================= */

let cart = [];


/* =========================
إضافة صنف للسلة
========================= */

function addToCart(category, index){

const item =
menuData[category][index];


const existing =
cart.find(

product =>

product.name === item[0] &&

product.category === category

);


if(existing){

existing.quantity++;

}else{

cart.push({

category:category,

name:item[0],

description:item[1],

price:item[2],

quantity:1

});

}


updateCartCount();


showToast(
"تمت إضافة " +
item[0] +
" إلى السلة 🛒"
);

}


/* =========================
تحديث عدد السلة
========================= */

function updateCartCount(){

const count =

cart.reduce(

(total,item)=>

total +
item.quantity,

0

);


document.getElementById(
"cartCount"
).innerText =
count;

}


/* =========================
رسالة الإضافة
========================= */

function showToast(message){

const toast =
document.createElement(
"div"
);


toast.innerText =
message;


toast.style.position =
"fixed";

toast.style.bottom =
"90px";

toast.style.left =
"50%";

toast.style.transform =
"translateX(-50%)";

toast.style.background =
"#d4af37";

toast.style.color =
"#111";

toast.style.padding =
"13px 22px";

toast.style.borderRadius =
"12px";

toast.style.fontWeight =
"bold";

toast.style.zIndex =
"9999";

toast.style.boxShadow =
"0 10px 30px rgba(0,0,0,.5)";


document.body.appendChild(
toast
);


setTimeout(

()=>{

toast.remove();

},

1800

);

}

function openCart(){

const modal =
document.getElementById(
"cartModal"
);

"flex";


renderCart();

}


/* =========================
إغلاق السلة
========================= */

function closeCart(){

document.getElementById(
"cartModal"
).style.display =
"none";

}


/* =========================
عرض محتويات السلة
========================= */

function renderCart(){

const cartItems =
document.getElementById(
"cartItems"
);


const totalElement =
document.getElementById(
"cartTotal"
);


cartItems.innerHTML =
"";


if(cart.length === 0){

cartItems.innerHTML = `

<div class="empty-cart">

🛒

<br><br>

السلة فارغة

<br>

أضف الأصناف التي تريدها من المنيو

</div>

`;


totalElement.innerText =
"0 ₪";


return;

}


let total =
0;


cart.forEach(

(item,index)=>{

const itemTotal =
item.price *
item.quantity;


total +=
itemTotal;


const cartItem =
document.createElement(
"div"
);


cartItem.className =
"cart-item";


cartItem.innerHTML = `

<div class="cart-item-info">

<div class="cart-item-name">

${item.name}

</div>

<div class="cart-item-category">

${item.category}

</div>

<div class="cart-item-price">

${item.price} ₪ ×
${item.quantity}
=
${itemTotal} ₪

</div>

</div>


<div class="quantity-control">

<button
onclick="changeQuantity(${index},1)">

+

</button>


<span>

${item.quantity}

</span>


<button
onclick="changeQuantity(${index},-1)">

−

</button>

</div>


<button
class="remove-item"
onclick="removeFromCart(${index})">

🗑️

</button>

`;


cartItems.appendChild(
cartItem
);

}

);


totalElement.innerText =
total +
" ₪";

}


/* =========================
تغيير الكمية
========================= */

function changeQuantity(
index,
amount
){

cart[index].quantity +=
amount;


if(
cart[index].quantity <= 0
){

cart.splice(
index,
1
);

}


updateCartCount();

renderCart();

}


/* =========================
حذف صنف
========================= */

function removeFromCart(index){

cart.splice(
index,
1
);


updateCartCount();

renderCart();

}

/* رقم واتساب الجديد */

);


window.open(

);

}
